name: Infrastructure Validation

on:
  push:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yaml"

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint cfn-lint

      - name: YAML syntax (yamllint)
        run: yamllint -d relaxed infrastructure

      - name: CloudFormation lint (cfn-lint)
        run: cfn-lint infrastructure/cloudformation/main.yaml

      - name: Static security checks
        run: node scripts/infra-static-checks.mjs

      - name: CloudFormation Guard
        uses: aws-cloudformation/cloudformation-guard@v1
        with:
          rules: infrastructure/guard/rules.guard
          templates: infrastructure/cloudformation
