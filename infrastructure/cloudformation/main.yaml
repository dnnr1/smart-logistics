AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Smart Logistics - Phase 3 placeholder template. Expanded in Phase 8 into the full
  serverless stack (DynamoDB, S3, Lambda, API Gateway, IAM, CloudFront, CloudWatch).

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ApplicationName:
    Type: String
    Default: smart-logistics

Resources:
  DeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  HistoricalDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ApplicationName}-${EnvironmentName}-historical"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ApplicationName}-${EnvironmentName}-web"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationName}-${EnvironmentName}"
      RetentionInDays: 14

Outputs:
  DeliveriesTableName:
    Value: !Ref DeliveriesTable
  HistoricalDataBucketName:
    Value: !Ref HistoricalDataBucket
  FrontendBucketName:
    Value: !Ref FrontendBucket
