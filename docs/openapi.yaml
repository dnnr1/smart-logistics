openapi: 3.0.3
info:
  title: Smart Logistics API
  version: 0.1.0
  description: >
    Backend API for the Smart Logistics platform. All responses use a consistent
    envelope. This contract is implemented with Zod schemas in packages/shared and
    AWS Lambda handlers behind API Gateway HTTP API.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/
    variables:
      apiId:
        default: example
      region:
        default: us-east-1
paths:
  /deliveries:
    get:
      summary: List deliveries
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeliveryStatus" } }
        - { name: carrier, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: tracking code search }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200": { description: List envelope }
        "400": { description: Validation error }
    post:
      summary: Create delivery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryInput" }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
  /deliveries/{id}:
    get:
      summary: Get delivery with history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Delivery }
        "400": { description: Validation error }
        "404": { description: Not found }
  /analytics:
    get:
      summary: Operational analytics
      responses:
        "200": { description: Analytics }
  /predictions:
    post:
      summary: Delivery risk score (heuristic baseline, SageMaker-ready)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [deliveryId],
                    properties: { deliveryId: { type: string } },
                  }
                - { $ref: "#/components/schemas/RiskInput" }
      responses:
        "200": { description: Risk result }
        "400": { description: Validation error }
        "404": { description: Delivery not found }
  /assistant:
    post:
      summary: Ask the grounded AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [question],
                properties: { question: { type: string, maxLength: 500 } },
              }
      responses:
        "200": { description: Answer with sources }
        "400": { description: Validation error }
        "503": { description: AI unavailable }
components:
  schemas:
    DeliveryStatus:
      type: string
      enum: [pending, in_transit, out_for_delivery, delivered, delayed, cancelled]
    RiskLevel:
      type: string
      enum: [low, medium, high]
    DeliveryInput:
      type: object
      required:
        [trackingCode, origin, destination, carrier, region, distanceKm, estimatedDeliveryAt]
      properties:
        trackingCode: { type: string, pattern: "^[A-Z0-9]{8,16}$" }
        origin: { type: string }
        destination: { type: string }
        carrier: { type: string }
        region: { type: string }
        distanceKm: { type: number, minimum: 0 }
        estimatedDeliveryAt: { type: string, format: date-time }
    RiskInput:
      type: object
      required: [distanceKm, estimatedTransitHours, carrier, region, status]
      properties:
        distanceKm: { type: number, minimum: 0 }
        estimatedTransitHours: { type: number, minimum: 0 }
        carrier: { type: string }
        region: { type: string }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        historicalDelayRate: { type: number, minimum: 0, maximum: 1 }
